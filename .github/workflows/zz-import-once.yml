name: Temporary WordPress import (run 2)
on:
  push:
    branches: [import-wordpress-posts]
    paths: [.github/workflows/zz-import-once.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Survey the live site
        run: |
          curl -sS -D - -o /dev/null "https://highearthorbit.com/wp-json/wp/v2/posts?per_page=1" | grep -i '^x-wp-total'
          curl -sS "https://highearthorbit.com/wp-json/wp/v2/posts?per_page=100&_fields=id,date,slug,link&orderby=date&order=desc" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(p['id'], p['date'][:10], p['link']) for p in d]"
      - run: python -m scripts.heo.import_wordpress
        env: { WP_URL: "https://highearthorbit.com" }
      - run: python -m scripts.heo.validate
      - name: Commit imported posts to this branch
        run: |
          git add content
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Import WordPress posts not yet in the repository" && git push || echo "nothing to import"
