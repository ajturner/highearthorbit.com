name: Deploy staging site

# Builds the Jekyll site and publishes it to GitHub Pages on every push to master.
# Requires Settings > Pages > Source: "GitHub Actions".
# A nightly run also picks up sync merges, which (made with GITHUB_TOKEN) don't
# trigger other workflows.
on:
  push:
    branches: [master]
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check that Pages serves this workflow's build
        # With Settings > Pages > Source set to "Deploy from a branch", GitHub also runs
        # its own Jekyll build of master after every push. That build skips _plugins/,
        # so pages lose the base path and render without styles, and it usually lands
        # after this deploy, so the site looks fine for a few seconds and then breaks.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type)
          if [ "$source" != "workflow" ]; then
            echo "::error::Pages source is '$source'. Set Settings > Pages > Source to GitHub Actions, or GitHub's branch build will replace this deploy."
            exit 1
          fi
          echo "Pages source is the workflow"
