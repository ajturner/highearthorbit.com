name: Deploy staging site

# Builds the Jekyll site and publishes it to GitHub Pages on every push to master.
# Requires Settings > Pages > Source: "GitHub Actions".
# A nightly run also picks up sync merges, which (made with GITHUB_TOKEN) don't
# trigger other workflows.
on:
  push:
    branches: [master]
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check the deployed site uses this build
        # If Settings > Pages > Source is "Deploy from a branch", GitHub serves its own
        # Jekyll build of master instead of this one. That build skips _plugins, so pages
        # lose the base path and render without styles. Fail loudly when that happens.
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base=$(echo "$PAGE_URL" | sed -E 's#https?://[^/]+##; s#/$##')
          for i in 1 2 3 4 5 6; do
            html=$(curl -fsSL "${PAGE_URL}talks/" || true)
            if echo "$html" | grep -q "href=\"${base}/assets/css/site.css\""; then
              echo "Deployed pages link ${base}/assets/css/site.css"; exit 0
            fi
            sleep 20
          done
          echo "::error::The live staging pages do not come from this build (stylesheet path lacks ${base}). Set Settings > Pages > Source to GitHub Actions."
          exit 1
