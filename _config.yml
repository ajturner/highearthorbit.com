# highearthorbit.com: static build of the same content WordPress publishes.
#
# GitHub Pages serves this build as the staging site. Content lives in content/
# (one Markdown or HTML file per item); see README.md for the fields.
# Build locally with: bundle exec jekyll serve

title: High Earth Orbit
author: Andrew Turner
email: ajturner@highearthorbit.com
description: >-
  Andrew Turner on open data, civic technology, the geospatial web, and the
  systems that connect them.
url: "https://highearthorbit.com"
# The Pages workflow sets --baseurl to the project path; keep this empty here.
baseurl: ""
timezone: America/New_York
lang: en-US

heo:
  # true on staging: items with `hidden: true` are shown, marked as drafts, and
  # every page carries noindex. Set false if this build ever serves as the
  # public fallback for WordPress.
  staging: true
  headshot: https://highearthorbit.com/wp-content/uploads/2021/05/AndrewTurner_Headshot-e1621219239429.jpeg
  flickr_profile: https://www.flickr.com/photos/ajturner/
  links:
    - { label: Mastodon, url: "https://nullisland.social/@ajturner", rel: me }
    - { label: GitHub, url: "https://github.com/ajturner", rel: me }
    - { label: LinkedIn, url: "https://www.linkedin.com/in/ajturner/" }
  nav:
    - { label: Writing, url: /articles/ }
    - { label: Projects, url: /projects/ }
    - { label: Talks, url: /talks/ }
    - { label: Photos, url: /photos/ }
    - { label: About, url: /about/ }
    - { label: Now, url: /now/ }

collections_dir: content
permalink: /articles/:title/
collections:
  talks:
    output: true
    permalink: /talks/:name/
  projects:
    output: true
    permalink: /projects/:name/
  photos:
    output: true
    permalink: /photos/:name/
  external:
    output: false

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, render_with_liquid: false }
  - scope: { path: "", type: talks }
    values: { layout: talk }
  - scope: { path: "", type: projects }
    values: { layout: project }
  - scope: { path: "", type: photos }
    values: { layout: album }
  - scope: { path: "" }
    values: { layout: page }

markdown: kramdown
plugins:
  - jekyll-feed
feed:
  path: feed.xml
  posts_limit: 20
  collections:
    talks: { path: talks/feed.xml }
    projects: { path: projects/feed.xml }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - node_modules/
  - schemas/
  - scripts/
  - tests/
  - wordpress/
  - requirements.txt
  - pytest.ini
